# Conduit's read surface: the console, the public proof pages, and the API.
#
# There is no secret in this file, and there must never be one. `wrangler.toml`
# is committed, and a `[vars]` entry is plaintext both here and in the
# dashboard. `DATABASE_URL` is the whole database, so it is set with
# `wrangler secret put` and appears below only as a comment saying so.
#
# Everything in `[vars]` is public by design: RPC endpoints anybody can call and
# a deployment ID that is already on chain in every message header.

name = "conduit"
main = "../../apps/web/dist/worker.bundle.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# The product's own domain. Cloudflare creates the DNS record and the
# certificate; the zone must be on this account.
routes = [
  { pattern = "tryconduit.xyz", custom_domain = true },
  { pattern = "www.tryconduit.xyz", custom_domain = true },
]

[observability]
enabled = true

# A page reads the database over many round trips, and opening a connection takes several of
# them. The database is Supabase in AWS eu-west-1 (the pooler host and SUPABASE_REGION say so).
# Over a long distance each round trip costs on the order of 100 ms, which is the waiting this
# setting is meant to cut: placement runs the Worker in the Cloudflare data centre closest to
# that region, so the round trips are short and the visitor crosses the distance once. It is
# an expectation until a deploy is measured. `wrangler dev` ignores it.
[placement]
region = "aws:eu-west-1"

[vars]
# Public. These are the same endpoints the verifier tells a stranger to use.
MONAD_RPC_URL = "https://testnet-rpc.monad.xyz"
BASE_RPC_URL = "https://sepolia.base.org"
DEPLOYMENT_ID = "0xdcb9db121ca873817fca7ee6a8e2cd8ef0249b7c83f4e656553338da00eccaa6"
COMMIT_SHA = "generation-3"

# The address the product is known by. Canonical links and link previews are built from it,
# so a copy served from the workers.dev address still points search engines at the real one.
SITE_URL = "https://tryconduit.xyz"

# The disposition kernel wired to this generation. Public: two contract
# addresses, a policy identifier that is already in every filed order, and the
# window length the registry itself reports. The policy's *content* hash is read
# from the registry rather than pinned here, because the registry is the
# authority on it and a copy would be a second thing to keep true.
DISPOSITION_CONTROLLER_BASE = "0xEa92410aBCc1712C303174E3a2Cf4FF6Dfc7D1D7"
AUTHORITY_REGISTRY_BASE = "0x33BB1eBa633d527f664bEFEd0FD6F13E0bE70E45"
DISPOSITION_POLICY_ID = "0x5eae1a29b5bab0300329f9d58599546ddb24bbbf081f612f6bf762a00f10e2ab"
DISPOSITION_CONTEST_WINDOW = "300"

# Secrets, set out of band and never written here:
#   wrangler secret put DATABASE_URL
#
# And the compliance authority's signing key. It is not a settlement key: it
# cannot move a token, sign an intent, decide a settlement, or release a leg
# without a canonical COMMIT already on chain. It signs eligibility answers
# Cleanverse gave, which every value-moving call requires alongside protocol
# state a participant's own wallet produced. ADR-0021.
#   wrangler secret put COMPLIANCE_SIGNER_PRIVATE_KEY
