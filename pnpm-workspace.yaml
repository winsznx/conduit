packages:
  - apps/*
  - packages/*

# Supply-chain overrides.
#
# PRD 15.5 forbids silencing a security tool without a documented waiver, so a
# dependency advisory is fixed here rather than suppressed in `pnpm audit`.
#
# drizzle-kit reaches esbuild twice: directly at 0.25.12, and through the
# abandoned @esbuild-kit/core-utils chain at 0.18.20, which carries
# GHSA-67mh-4wv8-2f99. The selector rewrites only the vulnerable range, leaving
# every other resolution untouched, and the replacement is exact-pinned like
# every other version in this repository (ADR-0002).
overrides:
  esbuild@<0.25.0: 0.28.1
